<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <title>Anmeldung wird fortgesetzt …</title>
    <!--
      Ziel des Links aus der Supabase-Mail (Passwort zurücksetzen). Supabase
      hängt die Tokens als #access_token=...&type=recovery an, das kollidiert
      mit dem HashRouter von react-admin. Diese Seite schreibt die Tokens nach
      #/auth-callback?... um, wo ra-supabase sie übernimmt und auf
      #/set-password weiterleitet. Vorlage: packages/demo/public/auth-callback.html
      in marmelab/ra-supabase.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef0f4;
        --card: rgba(255, 255, 255, 0.85);
        --text: #1d1d1f;
        --muted: #6e6e73;
        --accent: #2f6fd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15161a;
          --card: rgba(40, 42, 48, 0.85);
          --text: #f5f5f7;
          --muted: #a1a1a6;
          --accent: #5b93f0;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 360px;
        margin: 16px;
        padding: 32px 28px;
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        margin: 0 auto 16px;
        border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.4;
      }
      a {
        color: var(--accent);
      }
      .button {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card" id="loading">
      <div class="spinner"></div>
      <p>Anmeldung wird fortgesetzt …</p>
    </div>
    <div class="card" id="error" hidden>
      <h1>Der Link ist ungültig oder abgelaufen</h1>
      <p>
        Bitte fordern Sie einen neuen Link zum Zurücksetzen des Passworts an.
      </p>
      <a class="button" href="./#/forgot-password">Neuen Link anfordern</a>
      <p style="margin: 16px 0 0"><a href="./#/login">Zur Anmeldung</a></p>
    </div>
    <script>
      const params = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const type = params.get("type");

      if (accessToken && refreshToken && type) {
        const query = new URLSearchParams({
          access_token: accessToken,
          refresh_token: refreshToken,
          type,
        });
        // replace statt href: die Adresse mit den Tokens bleibt nicht im Verlauf.
        window.location.replace(`./#/auth-callback?${query}`);
      } else {
        // Abgelaufene Links kommen als #error=access_denied&error_code=otp_expired.
        document.getElementById("loading").hidden = true;
        document.getElementById("error").hidden = false;
      }
    </script>
  </body>
</html>
