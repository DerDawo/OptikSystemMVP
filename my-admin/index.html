<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no"
        />
        <meta name="theme-color" content="#0A66D6" />
        <link rel="manifest" href="./manifest.json" />
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
        <link rel="icon" href="./favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="UNICORN" />
        <meta name="application-name" content="UNICORN" />
        <title>UNICORN</title>
        <style>
            .loader-container {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: #f3f5f8;
            }

            .loader-logo {
                width: 96px;
                height: 96px;
            }
            .loader-name {
                margin-top: 14px;
                font-family: Roboto, Arial, sans-serif;
                font-size: 22px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: #1f2937;
            }
            .loader-unter {
                font-family: Roboto, Arial, sans-serif;
                font-size: 13px;
                color: #6b7280;
            }
            /* CSS Spinner from https://projects.lukehaas.me/css-loaders/ */

            .loader,
            .loader:before,
            .loader:after {
                border-radius: 50%;
            }

            .loader {
                color: #0a66d6;
                font-size: 4px;
                text-indent: -99999em;
                margin: 28px auto 0;
                position: relative;
                width: 10em;
                height: 10em;
                box-shadow: inset 0 0 0 1em;
                -webkit-transform: translateZ(0);
                -ms-transform: translateZ(0);
                transform: translateZ(0);
            }

            .loader:before,
            .loader:after {
                position: absolute;
                content: '';
            }

            .loader:before {
                width: 5.2em;
                height: 10.2em;
                background: #f3f5f8;
                border-radius: 10.2em 0 0 10.2em;
                top: -0.1em;
                left: -0.1em;
                -webkit-transform-origin: 5.2em 5.1em;
                transform-origin: 5.2em 5.1em;
                -webkit-animation: load2 2s infinite ease 1.5s;
                animation: load2 2s infinite ease 1.5s;
            }

            .loader:after {
                width: 5.2em;
                height: 10.2em;
                background: #f3f5f8;
                border-radius: 0 10.2em 10.2em 0;
                top: -0.1em;
                left: 5.1em;
                -webkit-transform-origin: 0px 5.1em;
                transform-origin: 0px 5.1em;
                -webkit-animation: load2 2s infinite ease;
                animation: load2 2s infinite ease;
            }

            @-webkit-keyframes load2 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }

            @keyframes load2 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
        </style>
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <noscript> Bitte aktivieren Sie JavaScript, um das Programm zu nutzen. </noscript>
        <div id="root">
            <div class="loader-container">
                <img class="loader-logo" src="./icon-192.png" alt="" />
                <div class="loader-name">UNICORN</div>
                <div class="loader-unter">Optik Ulm Systems</div>
                <div class="loader">Wird geladen …</div>
            </div>
        </div>
    </body>
    <script type="module" src="/src/index.tsx"></script>
</html>
